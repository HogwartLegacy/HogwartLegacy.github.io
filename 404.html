<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the map</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500&family=Instrument+Serif&display=swap">
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  /* the dusk sky alone, without the land: this page is a dead end, so it stays quiet */
  body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#0B1132 0%,#262C59 38%,#5D446F 66%,#B3695F 88%,#EC9B67 100%)}
  .lost{max-width:520px;padding:0 24px;text-align:center}
  .lost .code{font:500 13px var(--mono);letter-spacing:.2em;color:var(--muted)}
  .lost h1{margin-top:10px;font:400 clamp(52px,9vw,84px)/1 var(--display);color:var(--title)}
  .lost p{margin-top:16px;color:#D2C8B8}
  .lost .pill{margin-top:30px}
</style>
</head>
<body>
<main class="lost">
  <p class="code">404</p>
  <h1>Off the map</h1>
  <p>Nothing lives at this address. The work is back at the start.</p>
  <a class="pill" href="/">Back home</a>
</main>
</body>
</html>
